<!DOCTYPE html>
<html lang="zh-CN" data-theme="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>NTLab</title>
  <script>
    // 防闪引导：在样式表应用前恢复上次选择的主题与语言（默认英文）
    document.documentElement.dataset.theme = localStorage.getItem("ntlab-theme") || "blue";
    if (localStorage.getItem("ntlab-lang") !== "zh") document.documentElement.lang = "en";
  </script>
  <link rel="stylesheet" href="/vendor/tokens.css">
  <link rel="stylesheet" href="/vendor/themes.css">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/motion.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="brand">
        <span class="brand-mark">NT</span>
        <span class="brand-name">NTLab</span>
      </div>
      <nav id="nav">
        <!-- --ui-index 内联静态化：JS 事后补写会改 animation-delay，
             导致已结束的 nav-in 动画重置重放（导航条闪现） -->
        <a href="#/" data-route="home" style="--ui-index:0"><span class="ico">◈</span><span data-i18n-key="nav.home">首页</span></a>
        <a href="#/pe" data-route="pe" style="--ui-index:1"><span class="ico">▤</span><span data-i18n-key="nav.pe">PE 分析器</span></a>
        <a href="#/objdir" data-route="objdir" style="--ui-index:2"><span class="ico">⌘</span><span data-i18n-key="nav.objdir">ObjDir</span></a>
        <a href="#/resedit" data-route="resedit" style="--ui-index:3"><span class="ico">◫</span><span data-i18n-key="nav.resedit">资源修改器</span></a>
        <a href="#/playground" data-route="playground" style="--ui-index:4"><span class="ico">⚡</span><span data-i18n-key="nav.playground">试验台</span></a>
        <a href="#/debug" data-route="debug" style="--ui-index:5"><span class="ico">⚙</span><span data-i18n-key="nav.debug">调试</span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="side-controls">
          <div class="theme-dots" id="theme-dots" title="Theme"></div>
          <button id="lang-btn" class="lang-btn" type="button">EN</button>
        </div>
        <div class="credits">
          <img class="avatar" src="/assets/avatar.jpg" alt="CynthiaLx_">
          <span class="credits-txt">
            <span class="made">Made with ♡ by CynthiaLx_</span>
            <a class="gh" href="https://github.com/Cynthia-lxx/Misc/tree/main/NTLab" target="_blank" rel="noopener">
              <svg class="gh-ico" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
                <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
              </svg><span>GitHub</span>
            </a>
          </span>
        </div>
        <span class="ver" id="ver">…</span>
      </div>
    </aside>
    <main id="content"></main>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
