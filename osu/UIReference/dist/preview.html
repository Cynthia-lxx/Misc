<body>
  <div class="pv-shell">
    <aside class="pv-side">
      <div class="pv-brand">
        <span class="pv-brand-mark">UR</span>
        <span class="pv-brand-text"><span data-i18n="brand">UI Reference Kit</span><small>preview / 2026-11-13</small></span>
      </div>
      <nav class="pv-nav" id="pv-nav" aria-label="Preview views"></nav>

        <div class="pv-side-row pv-muted" data-i18n="footer">MIT-derived · GPL-3.0 target</div>
      </div>
    </aside>

    <main class="pv-main">
      <header class="pv-top">
        <div class="pv-head-title">
          <h1 id="pv-view-title">总览</h1>
          <p id="pv-view-desc"></p>
        </div>
        <div class="pv-controls">
          <label><span data-i18n="theme">Theme</span><ui-dropdown id="pv-theme" value="blue">            <ui-option value="red" label="Red"></ui-option>
            <ui-option value="orange" label="Orange"></ui-option>
            <ui-option value="lime" label="Lime"></ui-option>
            <ui-option value="green" label="Green"></ui-option>
            <ui-option value="aquamarine" label="Aquamarine"></ui-option>
            <ui-option value="blue" label="Blue"></ui-option>
            <ui-option value="purple" label="Purple"></ui-option>
            <ui-option value="plum" label="Plum"></ui-option>
            <ui-option value="pink" label="Pink"></ui-option></ui-dropdown></label>
          <label><span data-i18n="lang">Lang</span><ui-dropdown id="pv-lang" value="en">            <ui-option value="en" label="en"></ui-option>
            <ui-option value="zh-CN" label="zh-CN"></ui-option></ui-dropdown></label>
          <label><span data-i18n="speed">Speed</span><ui-dropdown id="pv-rate" value="1">
            <ui-option value="0.5" label="0.5×"></ui-option>
            <ui-option value="1" label="1×"></ui-option>
            <ui-option value="1.5" label="1.5×"></ui-option>
            <ui-option value="2" label="2×"></ui-option>
          </ui-dropdown></label>
          <ui-button id="pv-reduce" label="Reduced motion: off"></ui-button>
          <ui-button id="pv-log-toggle"><span data-i18n="log">Log</span> <span id="pv-log-count">0</span></ui-button>
        </div>
      </header>

      <div class="pv-view" id="pv-view"></div>

      <footer class="pv-foot">
        <span id="pv-foot-left">ready</span>
        <span id="pv-foot-right">hash-route · no build step</span>
      </footer>
    </main>
  </div>

  <aside class="pv-log-panel" id="pv-log-panel">
    <header><strong data-i18n="eventLog">Event log</strong><span><ui-button id="pv-log-clear" label="clear"></ui-button> <ui-button id="pv-log-close" label="×"></ui-button></span></header>
    <ul id="pv-log-list"></ul>
  </aside>
