<html lang="en" data-theme="blue">
<head>

  <link rel="stylesheet" href="themes.css">

  <link rel="stylesheet" href="04-components/ui-action-rail/ui-action-rail.css">
  <link rel="stylesheet" href="04-components/ui-reveal-overlay/ui-reveal-overlay.css">
  <link rel="stylesheet" href="06-visual-effects/glow/glow.css">
  <link rel="stylesheet" href="06-visual-effects/compositions/status-pulse.css">
  <link rel="stylesheet" href="components/ui-panel/ui-panel.css" data-ui-panel-styles>
  <link rel="stylesheet" href="05-motion/motion.css">
  <link rel="stylesheet" href="05-motion/layered-view.css">
  <link rel="stylesheet" href="04-components/ui-action-rail/ui-action-rail.css">
  <link rel="stylesheet" href="04-components/ui-reveal-overlay/ui-reveal-overlay.css">

</head>
<body>
  <div class="pv-shell">
    <aside class="pv-side">
      <div class="pv-brand">
        <span class="pv-brand-mark">UR</span>
        <span class="pv-brand-text">UI Reference Kit<small>preview / 2026-11-13</small></span>
      </div>
      <nav class="pv-nav" id="pv-nav" aria-label="Preview views"></nav>
      <div class="pv-side-foot">
        <div class="pv-side-row"><span class="pv-dot" id="pv-server-dot"></span><span id="pv-server-status">checking server…</span></div>
        <div class="pv-side-row pv-muted" id="pv-api-note">static mode fallback available</div>
        <div class="pv-side-row pv-muted">MIT-derived · GPL-3.0 target</div>
      </div>
    </aside>

    <main class="pv-main">
      <header class="pv-top">
        <div class="pv-head-title">
          <h1 id="pv-view-title">总览</h1>
          <p id="pv-view-desc"></p>
        </div>
        <div class="pv-controls">
          <label>Theme<select id="pv-theme">            <option value="red">Red</option>
            <option value="orange">Orange</option>
            <option value="lime">Lime</option>
            <option value="green">Green</option>
            <option value="aquamarine">Aquamarine</option>
            <option value="blue" selected>Blue</option>
            <option value="purple">Purple</option>
            <option value="plum">Plum</option>
            <option value="pink">Pink</option></select></label>
          <label>Lang<select id="pv-lang">            <option value="en" selected>en</option>
            <option value="zh-CN">zh-CN</option></select></label>
          <label>Speed<select id="pv-rate">
            <option value="0.5">0.5×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select></label>
          <ui-button id="pv-reduce" label="Reduced motion: off"></ui-button>
          <ui-button id="pv-log-toggle">Log <span id="pv-log-count">0</span></ui-button>
        </div>
      </header>

      <div class="pv-view" id="pv-view"></div>

      <footer class="pv-foot">
        <span id="pv-foot-left">ready</span>
        <span id="pv-foot-right">hash-route · no build step</span>
      </footer>
    </main>
  </div>

  <aside class="pv-log-panel" id="pv-log-panel">
    <header><strong>Event log</strong><span><ui-button id="pv-log-clear" label="clear"></ui-button> <ui-button id="pv-log-close" label="×"></ui-button></span></header>
    <ul id="pv-log-list"></ul>
  </aside>
