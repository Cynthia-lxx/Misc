[project]
name = "oi-assistant"
version = "0.1.0"
description = "OI Code Console — local B/S console for OI.py (OI助手)"
authors = [{ name = "CynthiaLx_" }]
requires-python = ">=3.12"

# fspack AST 依赖分析 + 这里显式声明的并集进包；OI.py 依赖 openai/click/rich/pyperclip
dependencies = [
    "openai>=1.0",
    "click>=8.0",
    "rich>=13.0",
    "pyperclip>=1.8",
]

# fspack 打包：发行入口 oi_assistant:main（OI.py 是 CLI，保持不动，不参与发行入口）
[project.scripts]
oi-assistant = "oi_assistant:main"

[tool.fspack]
# 应用图标：下一步再配（icon = "web/static/assets/app.ico"）
description = "OI Code Console"
author = "CynthiaLx_"
# 不进包的目录/文件：OIenv（venv）/ refs（参考资料）/ 工具配置与缓存
# 注意：fspack 的 parsing.py 读取的键名是 exclude（不是 exclude-dirs）
# P*.cpp 是工作区题解、toolchain/ 是运行/调试必需的 MinGW64 —— 都必须进包
exclude = ["OIenv", "refs", ".playwright-cli", ".codebuddy", "__pycache__", "build", "dist"]
