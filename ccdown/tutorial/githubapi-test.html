<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repository Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        input, button {
            margin-bottom: 10px;
            padding: 10px;
            font-size: 16px;
        }
        #results {
            margin-top: 20px;
        }
        .repo {
            margin-bottom: 20px;
        }
        .repo a {
            text-decoration: none;
            font-weight: bold;
            color: #0066cc;
        }
        .repo p {
            margin: 5px 0;
        }
    </style>
</head>
<body>

<h1>GitHub Repository Search</h1>

<!-- Input fields for search query and API token -->
<div>
    <label for="keyword">Search Keyword:</label>
    <input type="text" id="keyword" placeholder="Enter keyword" />
</div>

<div>
    <label for="token">API Token:</label>
    <input type="text" id="token" placeholder="Enter GitHub API token" />
</div>

<button onclick="searchRepositories()">Search</button>

<!-- Display results here -->
<div id="results"></div>

<script>
    // Function to search repositories on GitHub API
    async function searchRepositories() {
        const keyword = document.getElementById("keyword").value;
        const token = document.getElementById("token").value;
        const resultsDiv = document.getElementById("results");

        if (!keyword || !token) {
            resultsDiv.innerHTML = "<p>Please provide both a search keyword and an API token.</p>";
            return;
        }

        resultsDiv.innerHTML = "<p>Loading...</p>";

        const url = `https://api.github.com/search/repositories?q=${keyword}&sort=stars&order=desc`;
        const response = await fetch(url, {
            method: "GET",
            headers: {
                "Authorization": `token ${token}`,
                "Accept": "application/vnd.github.v3+json"
            }
        });

        if (response.ok) {
            const data = await response.json();
            displayResults(data.items);
        } else {
            resultsDiv.innerHTML = "<p>Error fetching data. Please check the API token or try again later.</p>";
        }
    }

    // Function to display search results
    function displayResults(repositories) {
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = ""; // Clear previous results

        if (repositories.length === 0) {
            resultsDiv.innerHTML = "<p>No repositories found.</p>";
            return;
        }

        repositories.forEach(repo => {
            const repoDiv = document.createElement("div");
            repoDiv.classList.add("repo");

            const repoName = document.createElement("h3");
            const repoLink = document.createElement("a");
            repoLink.href = repo.html_url;
            repoLink.target = "_blank";
            repoLink.textContent = repo.name;
            repoName.appendChild(repoLink);

            const repoDescription = document.createElement("p");
            repoDescription.textContent = repo.description || "No description available.";

            const repoLanguage = document.createElement("p");
            repoLanguage.textContent = `Language: ${repo.language || "N/A"}`;

            repoDiv.appendChild(repoName);
            repoDiv.appendChild(repoDescription);
            repoDiv.appendChild(repoLanguage);
            resultsDiv.appendChild(repoDiv);
        });
    }
</script>

</body>
</html>
